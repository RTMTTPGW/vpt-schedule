<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ВПТ — Расписание занятий</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060b18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #060b18;
  --bg2:       #091020;
  --surface:   #0d1628;
  --surface2:  #121e36;
  --surface3:  #172440;
  --border:    rgba(80,130,200,.18);
  --border2:   rgba(100,160,220,.28);
  --metal:     #4a7eb5;
  --metal2:    #7ab3e0;
  --ice:       #a8c8e8;
  --text:      #c8d8ec;
  --text2:     #8aadcc;
  --muted:     #4a6a88;
  --glow:      rgba(74,126,181,.22);
  --glow2:     rgba(122,179,224,.12);
  --r:         12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 24px);
}

/* ── Атмосферный фон ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(74,126,181,.2) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 10% 80%,  rgba(42,80,140,.15) 0%, transparent 50%),
    radial-gradient(ellipse 30% 25% at 90% 60%,  rgba(100,160,220,.08) 0%, transparent 45%);
  pointer-events: none;
  z-index: 0;
}

/* Тонкая текстура зерна */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: .4;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 660px;
  margin: 0 auto;
  padding: 0 16px 56px;
}

/* ── Шапка ── */
header {
  padding: 36px 0 28px;
  display: flex;
  align-items: center;
  gap: 16px;
  animation: fadeDown .5s ease both;
}

@keyframes fadeDown {
  from { opacity:0; transform:translateY(-12px); }
  to   { opacity:1; transform:translateY(0); }
}

.emblem {
  width: 54px; height: 54px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%,
    #1e3a5f 0%, #0d1f38 45%, #060f20 100%);
  border: 1.5px solid rgba(120,180,240,.25);
  box-shadow:
    0 0 0 4px rgba(74,126,181,.08),
    0 8px 24px rgba(6,10,24,.8),
    inset 0 1px 2px rgba(168,200,232,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.emblem::before {
  content: '';
  position: absolute;
  top: -40%; left: -40%;
  width: 80%; height: 60%;
  background: radial-gradient(ellipse, rgba(168,200,232,.2), transparent);
  border-radius: 50%;
}

.emblem svg {
  width: 28px; height: 28px;
  fill: none;
  stroke: var(--ice);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .85;
  filter: drop-shadow(0 0 6px rgba(168,200,232,.4));
}

.header-text { flex: 1; }

.header-text h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 5vw, 26px);
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--ice);
  line-height: 1.1;
  text-shadow: 0 0 20px rgba(168,200,232,.3);
}

.header-text p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: .3px;
  text-transform: uppercase;
}

/* ── Горизонтальный разделитель ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2), transparent);
  margin-bottom: 24px;
  animation: fadeIn .6s ease .15s both;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ── Секции ── */
.section {
  margin-bottom: 18px;
  animation: fadeUp .4s ease both;
}

.section:nth-child(2) { animation-delay: .05s; }
.section:nth-child(3) { animation-delay: .1s; }
.section:nth-child(4) { animation-delay: .15s; }
.section:nth-child(5) { animation-delay: .2s; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}

.label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--metal);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border2), transparent);
}

/* ── Корпуса ── */
.corps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.corp-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 10px 14px;
  cursor: pointer;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  transition: all .2s ease;
  position: relative;
  overflow: hidden;
}

.corp-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(168,200,232,.2), transparent);
}

.corp-btn .num {
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--metal2);
  line-height: 1;
  margin-bottom: 3px;
  text-shadow: 0 0 12px rgba(122,179,224,.4);
}

.corp-btn .sub {
  color: var(--muted);
  font-size: 11px;
}

.corp-btn:hover {
  border-color: rgba(120,180,240,.4);
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(6,10,24,.5), 0 0 0 1px rgba(74,126,181,.15);
}

.corp-btn.active {
  border-color: var(--metal);
  background: linear-gradient(160deg, var(--surface3), var(--surface2));
  box-shadow:
    0 0 0 1px var(--metal),
    0 0 16px rgba(74,126,181,.2),
    0 4px 12px rgba(6,10,24,.6);
}

.corp-btn.active .num { color: var(--ice); }

/* ── Курсы ── */
.course-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.course-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 13px 6px;
  cursor: pointer;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--metal2);
  text-align: center;
  transition: all .18s ease;
  position: relative;
}

.course-btn .sub {
  display: block;
  font-family: 'Manrope', sans-serif;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-top: 1px;
}

.course-btn:hover  { border-color: rgba(120,180,240,.35); background: var(--surface2); transform: translateY(-1px); }
.course-btn.active { border-color: var(--metal); background: var(--surface2); box-shadow: 0 0 0 1px var(--metal), 0 0 14px rgba(74,126,181,.18); }
.course-btn.active { color: var(--ice); }

/* ── Группы ── */
#groups-section { animation: fadeUp .3s ease both; }

.groups-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}

.groups-list {
  max-height: 270px;
  overflow-y: auto;
}

.groups-list::-webkit-scrollbar { width: 3px; }
.groups-list::-webkit-scrollbar-track { background: transparent; }
.groups-list::-webkit-scrollbar-thumb { background: rgba(74,126,181,.3); border-radius: 2px; }

.group-btn {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 11px 16px;
  cursor: pointer;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  transition: all .14s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.group-btn:last-child { border-bottom: none; }

.group-btn .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background .14s;
}

.group-btn:hover  { background: rgba(74,126,181,.08); }
.group-btn:hover .dot { background: var(--metal2); }
.group-btn.active { background: rgba(74,126,181,.14); color: var(--ice); }
.group-btn.active .dot { background: var(--ice); }

.groups-msg {
  padding: 28px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* ── Режим ── */
.mode-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.mode-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 11px;
  cursor: pointer;
  color: var(--muted);
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  transition: all .15s;
}

.mode-btn:hover { border-color: rgba(120,180,240,.3); color: var(--text2); }
.mode-btn.active {
  background: linear-gradient(135deg, var(--surface3), var(--surface2));
  border-color: var(--metal);
  color: var(--ice);
  box-shadow: 0 0 0 1px rgba(74,126,181,.2);
}

/* ── Кнопка получить ── */
.btn-get {
  width: 100%;
  position: relative;
  background: linear-gradient(135deg, #1a3560 0%, #0d1f40 50%, #162d54 100%);
  border: 1px solid var(--metal);
  border-radius: var(--r);
  padding: 16px;
  color: var(--ice);
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  transition: all .2s ease;
  box-shadow: 0 0 20px rgba(74,126,181,.25), 0 4px 16px rgba(6,10,24,.6);
  overflow: hidden;
  margin-bottom: 24px;
}

.btn-get::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(168,200,232,.08), transparent);
  transition: left .5s ease;
}

.btn-get:hover::before { left: 150%; }
.btn-get:hover {
  background: linear-gradient(135deg, #213f72 0%, #112540 50%, #1c3560 100%);
  box-shadow: 0 0 28px rgba(74,126,181,.4), 0 6px 20px rgba(6,10,24,.7);
  transform: translateY(-1px);
}
.btn-get:active  { transform: translateY(0); }
.btn-get:disabled { opacity: .4; cursor: not-allowed; transform: none; }

/* ── Расписание ── */
#result { animation: fadeUp .3s ease both; }

.sched-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(6,10,24,.5);
}

.sched-head {
  padding: 16px 18px 14px;
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.sched-head::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(168,200,232,.25), transparent);
}

.sched-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--ice);
  letter-spacing: .3px;
}

.sched-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 5px;
  font-size: 12px;
  color: var(--muted);
}

.meta-tag {
  display: flex;
  align-items: center;
  gap: 4px;
}

.pair-item {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 10px;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  align-items: start;
  transition: background .12s;
}

.pair-item:last-child { border-bottom: none; }
.pair-item:hover { background: rgba(74,126,181,.06); }

.pair-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--metal2);
  line-height: 1;
  text-align: center;
  padding-top: 1px;
  text-shadow: 0 0 10px rgba(122,179,224,.35);
}

.pair-subj {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}

.pair-info {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 5px;
}

.pair-tag {
  font-size: 11px;
  color: var(--text2);
  background: rgba(74,126,181,.08);
  border: 1px solid rgba(74,126,181,.15);
  border-radius: 6px;
  padding: 2px 7px;
}

/* ── Состояния ── */
.state-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 40px 20px;
  text-align: center;
}

.state-icon { font-size: 34px; margin-bottom: 10px; }
.state-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--ice); margin-bottom: 5px; }
.state-text  { font-size: 13px; color: var(--muted); line-height: 1.5; }

.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border2);
  border-top-color: var(--metal2);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.empty-day {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 30px 20px;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

/* ── Toast ── */
#toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #1a3560, #0d1f40);
  border: 1px solid var(--metal);
  color: var(--ice); padding: 9px 18px;
  border-radius: 20px; font-size: 13px;
  z-index: 999; opacity: 0;
  transition: opacity .2s; pointer-events: none;
  font-family: 'Manrope', sans-serif;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(6,10,24,.6), 0 0 12px rgba(74,126,181,.2);
}

/* ── Футер ── */
footer {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
  padding-top: 28px;
  margin-top: 28px;
  border-top: 1px solid var(--border);
  line-height: 2;
  letter-spacing: .2px;
}

footer a { color: var(--metal2); text-decoration: none; }
footer a:hover { color: var(--ice); }


</style>
</head>
<body>
<div class="wrap">

  <header>
        <div class="emblem">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон кружка -->
  <circle cx="50" cy="50" r="50" fill="#0d1e38"/>
  <!-- Основание нижнее -->
  <rect x="14" y="72" width="72" height="7" rx="1.5" fill="#4a7eb5" opacity="0.9"/>
  <!-- Ступени -->
  <rect x="18" y="67" width="64" height="5" rx="1" fill="#5a8ec5" opacity="0.85"/>
  <!-- Боковые крылья -->
  <rect x="14" y="52" width="12" height="15" rx="1" fill="#3d6e9e" opacity="0.8"/>
  <rect x="74" y="52" width="12" height="15" rx="1" fill="#3d6e9e" opacity="0.8"/>
  <!-- Горизонтальная полоса под колоннами -->
  <rect x="22" y="60" width="56" height="7" rx="1" fill="#4a7eb5" opacity="0.85"/>
  <!-- Колонны -->
  <rect x="24" y="40" width="5" height="21" rx="1" fill="#6a9ec8"/>
  <rect x="33" y="40" width="5" height="21" rx="1" fill="#6a9ec8"/>
  <rect x="42" y="40" width="5" height="21" rx="1" fill="#6a9ec8"/>
  <rect x="51" y="40" width="5" height="21" rx="1" fill="#6a9ec8"/>
  <rect x="60" y="40" width="5" height="21" rx="1" fill="#6a9ec8"/>
  <rect x="69" y="40" width="5" height="21" rx="1" fill="#6a9ec8"/>
  <!-- Архитрав (полоса над колоннами) -->
  <rect x="22" y="35" width="56" height="6" rx="1" fill="#5a8ec5"/>
  <!-- Фронтон (треугольник) -->
  <polygon points="50,20 20,35 80,35" fill="#4a7eb5"/>
  <!-- Блик на фронтоне -->
  <polygon points="50,22 22,35 78,35" fill="none" stroke="rgba(168,210,240,0.15)" stroke-width="0.8"/>
  <!-- Тонкий блик сверху -->
  <path d="M20,35 L50,20 L80,35" fill="none" stroke="rgba(168,210,240,0.2)" stroke-width="0.5"/>
</svg>
    </div>
    <div class="header-text">
      <h1>Расписание занятий</h1>
      <p>Волжский политехнический техникум</p>
    </div>
  </header>

  <div class="divider"></div>

  <!-- Корпус -->
  <div class="section">
    <div class="label">Корпус</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px;padding:8px 12px;background:rgba(74,126,181,.06);border:1px solid rgba(74,126,181,.12);border-radius:8px;line-height:1.5;">
      ⚠️ 2 корпус не поддерживается — диспетчеры там ведут таблицы в нестандартном формате
    </div>
    <div class="corps-grid" id="corps-grid">
      <div class="state-box" style="grid-column:1/-1;padding:22px">
        <div class="spinner"></div>
        <div class="state-text">Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- Курс -->
  <div class="section" id="course-section" style="display:none">
    <div class="label">Курс</div>
    <div class="course-grid">
      <button class="course-btn" onclick="selectCourse(1,this)">I<span class="sub">курс</span></button>
      <button class="course-btn" onclick="selectCourse(2,this)">II<span class="sub">курс</span></button>
      <button class="course-btn" onclick="selectCourse(3,this)">III<span class="sub">курс</span></button>
      <button class="course-btn" onclick="selectCourse(4,this)">IV<span class="sub">курс</span></button>
    </div>
  </div>

  <!-- Группа -->
  <div class="section" id="groups-section" style="display:none">
    <div class="label">Группа</div>
    <div class="groups-wrap">
      <div id="groups-list" class="groups-list">
        <div class="groups-msg">Выбери курс выше</div>
      </div>
    </div>
  </div>

  <!-- Режим -->
  <div class="section">
    <div class="label">Режим</div>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="today">📅 На сегодня</button>
      <button class="mode-btn"        data-mode="latest">🆕 Последнее</button>
    </div>
  </div>

  <button class="btn-get" id="btn-get">Получить расписание</button>

  <div id="result"></div>

  <footer>
    <div class="footer-motto">Techies Vitae Qui ab anno 1951</div>
    Данные из Google Drive ВПТ<br>
    Telegram: <a href="https://t.me/VPTshedulebot" target="_blank">@VPTshedulebot</a>
  </footer>

</div>

<div id="toast"></div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
// TODO: обновить на актуальный URL Railway после переноса на новый бот
const API_URLS = [
  'https://schedule-bot-production-0eff.up.railway.app',
];
const CACHE_TTL = 10 * 60 * 1000;

let apiBase       = null;
let selectedCorp  = null;
let selectedCourse= null;
let selectedGroup = null;
let selectedMode  = 'today';

// ─── Telegram WebApp ────────────────────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.expand();
  tg.BackButton.show();
  tg.BackButton.onClick(() => tg.close());
  tg.setHeaderColor && tg.setHeaderColor('#060b18');
  tg.setBackgroundColor && tg.setBackgroundColor('#060b18');
  tg.ready();
}

// ─── Кэш ───────────────────────────────────────────────────────────────────
function cacheSet(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}
function cacheGet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    return Date.now() - ts > CACHE_TTL ? null : data;
  } catch(e) { return null; }
}

// ─── Определяем рабочий API ─────────────────────────────────────────────────
async function findWorkingApi() {
  for (const url of API_URLS) {
    try {
      const res = await fetch(`${url}/health`, { signal: AbortSignal.timeout(5000) });
      if (res.ok) return url;
    } catch(e) {}
  }
  return null;
}

// ─── Загрузка корпусов ──────────────────────────────────────────────────────
async function loadCorps() {
  const cached = cacheGet('corps_v2');
  if (cached && cached.length > 0) { renderCorps(cached); return; }

  const grid = document.getElementById('corps-grid');

  apiBase = await findWorkingApi();
  if (!apiBase) {
    grid.innerHTML = `<div class="state-box" style="grid-column:1/-1">
      <div class="state-icon">📡</div>
      <div class="state-title">Нет соединения</div>
      <div class="state-text">Сервер недоступен. Попробуй позже или открой бота в Telegram.</div>
    </div>`;
    return;
  }

  try {
    const res = await fetch(`${apiBase}/corps`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const corps = await res.json();
    const filtered = corps.filter(c => c.id !== 'corp2');
    cacheSet('corps_v2', filtered);
    renderCorps(filtered);
  } catch(e) {
    grid.innerHTML = `<div class="state-box" style="grid-column:1/-1">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Ошибка загрузки</div>
      <div class="state-text">${e.message}<br><br>
        <button onclick="loadCorps()" style="
          background:linear-gradient(135deg,#1a3560,#0d1f40);
          border:1px solid var(--metal);color:var(--ice);
          padding:8px 16px;border-radius:8px;cursor:pointer;
          font-family:Manrope,sans-serif;font-size:13px;font-weight:600;
        ">Повторить</button>
      </div>
    </div>`;
  }
}

function renderCorps(corps) {
  const grid = document.getElementById('corps-grid');
  grid.innerHTML = '';
  corps.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'corp-btn';
    btn.dataset.id = c.id;
    const num = c.name.replace(/\s*корпус\s*/i,'').trim();
    btn.innerHTML = `<span class="num">${num}</span><span class="sub">${c.name}</span>`;
    btn.onclick = () => {
      selectedCorp = c.id; selectedCourse = null; selectedGroup = null;
      document.querySelectorAll('.corp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.course-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('groups-list').innerHTML = '<div class="groups-msg">Выбери курс выше</div>';
      document.getElementById('groups-section').style.display = 'none';
      document.getElementById('course-section').style.display = 'block';
    };
    grid.appendChild(btn);
  });
}

// ─── Курс → Группы ─────────────────────────────────────────────────────────
async function selectCourse(course, btn) {
  if (!selectedCorp) { showToast('Сначала выбери корпус'); return; }
  selectedCourse = course; selectedGroup = null;
  document.querySelectorAll('.course-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('groups-section').style.display = 'block';
  await loadGroups(selectedCorp, course);
  document.getElementById('groups-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function loadGroups(corpId, course) {
  const list = document.getElementById('groups-list');
  list.innerHTML = '<div class="groups-msg"><div class="spinner" style="margin:0 auto 8px"></div>Загружаю...</div>';

  const cacheKey = `groups_v2:${corpId}`;
  let all = cacheGet(cacheKey);

  if (!all) {
    try {
      const res = await fetch(`${apiBase}/groups?corp=${encodeURIComponent(corpId)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      all = data.groups || [];
      if (all.length) cacheSet(cacheKey, all);
    } catch(e) {
      list.innerHTML = `<div class="groups-msg">Ошибка: ${e.message}</div>`;
      return;
    }
  }

  const now = new Date();
  const cur = now.getFullYear() % 100;
  const entry = now.getMonth() >= 8 ? cur - course + 1 : cur - course;
  const filtered = all.filter(g => { const m = g.match(/^\d+-(\d{2})/); return m && +m[1] === entry % 100; });
  const groups = filtered.length ? filtered : all;

  if (!groups.length) { list.innerHTML = '<div class="groups-msg">Группы не найдены</div>'; return; }

  list.innerHTML = '';
  groups.forEach(g => {
    const m = g.match(/^([\d\-]+\s+[А-ЯЁA-Z]+[\-\d]+)/);
    const label = m ? m[1].trim() : g.trim();
    const btn = document.createElement('button');
    btn.className = 'group-btn';
    btn.innerHTML = `<span class="dot"></span>${label}`;
    btn.title = g;
    btn.onclick = () => {
      selectedGroup = g;
      document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    list.appendChild(btn);
  });
}

// ─── Режим ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    selectedMode = b.dataset.mode;
  };
});

// ─── Получить расписание ────────────────────────────────────────────────────
document.getElementById('btn-get').onclick = getSchedule;

async function getSchedule() {
  if (!selectedCorp)  { showToast('Выбери корпус');  return; }
  if (!selectedGroup) { showToast('Выбери группу');  return; }

  const btn    = document.getElementById('btn-get');
  const result = document.getElementById('result');

  const cacheKey = `sched_v2:${selectedCorp}:${selectedGroup}:${selectedMode}`;
  const cached = cacheGet(cacheKey);
  if (cached) { renderSchedule(result, cached); result.scrollIntoView({ behavior:'smooth', block:'start' }); return; }

  btn.disabled = true;
  btn.textContent = 'Загрузка...';
  result.innerHTML = '<div class="state-box"><div class="spinner"></div><div class="state-text">Загружаю расписание...</div></div>';

  try {
    const url = `${apiBase}/schedule?corp=${encodeURIComponent(selectedCorp)}&group=${encodeURIComponent(selectedGroup)}&mode=${selectedMode}`;
    const res = await fetch(url);
    if (res.status === 404) {
      const e = await res.json();
      result.innerHTML = `<div class="state-box"><div class="state-icon">🔍</div><div class="state-title">Не найдено</div><div class="state-text">${e.detail || 'Расписание не найдено'}</div></div>`;
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    cacheSet(cacheKey, data);
    renderSchedule(result, data);
    result.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(e) {
    result.innerHTML = `<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">Ошибка</div><div class="state-text">${e.message}</div></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Получить расписание';
  }
}

// ─── Рендер расписания ──────────────────────────────────────────────────────
function renderSchedule(container, data) {
  if (!data.pairs?.length) {
    container.innerHTML = '<div class="empty-day">🎉 Занятий нет — свободный день!</div>';
    return;
  }
  const ds = data.date ? `${data.date}${data.day ? ', ' + data.day : ''}` : 'Расписание';
  const pairs = data.pairs.map(p => `
    <div class="pair-item">
      <div class="pair-num">${p.num}</div>
      <div>
        <div class="pair-subj">${esc(p.subject)}</div>
        <div class="pair-info">
          ${p.teacher ? `<span class="pair-tag">👩‍🏫 ${esc(p.teacher)}</span>` : ''}
          ${p.room    ? `<span class="pair-tag">🏠 ${esc(p.room)}</span>`    : ''}
        </div>
      </div>
    </div>`).join('');

  container.innerHTML = `
    <div class="sched-card">
      <div class="sched-head">
        <div class="sched-date">${ds}</div>
        <div class="sched-meta">
          <span class="meta-tag">👥 ${esc(data.group)}</span>
          <span class="meta-tag">🏢 ${esc(data.corp_name)}</span>
          <span class="meta-tag">📚 ${data.pairs.length} ${plural(data.pairs.length)}</span>
        </div>
      </div>
      ${pairs}
    </div>`;
}

// ─── Утилиты ────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function plural(n) {
  if (n%10===1 && n%100!==11) return 'пара';
  if ([2,3,4].includes(n%10) && ![12,13,14].includes(n%100)) return 'пары';
  return 'пар';
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2000);
}

// ─── PWA ────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// ─── Старт ──────────────────────────────────────────────────────────────────
loadCorps();
</script>
