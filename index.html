<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВПТ — Расписание</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c63ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ВПТ">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --success: #4ade80;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Фоновый узор */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(108,99,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255,101,132,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* Шапка */
  header {
    padding: 40px 0 32px;
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }

  .logo-mark {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 900;
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(108,99,255,0.3);
  }

  .logo-text h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .logo-text p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Карточки выбора */
  .section-label {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .section { margin-bottom: 28px; }

  /* Сетка корпусов */
  .corps-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .corp-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    font-size: 15px;
    font-weight: 600;
    position: relative;
    overflow: hidden;
  }

  .corp-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .corp-btn span { position: relative; z-index: 1; }

  .corp-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
  .corp-btn.active {
    border-color: var(--accent);
    background: var(--surface2);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(108,99,255,0.2);
  }
  .corp-btn.active::before { opacity: 0.08; }

  .corp-num {
    display: block;
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Поиск группы */
  .search-wrap {
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--accent); }

  .search-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Кнопки режима */
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .mode-tab {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    color: var(--text-muted);
    font-family: 'Golos Text', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    text-align: center;
  }

  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Кнопка получить */
  .btn-get {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 24px rgba(108,99,255,0.3);
    margin-bottom: 28px;
  }

  .btn-get:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(108,99,255,0.4); }
  .btn-get:active { transform: translateY(0); }
  .btn-get:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Результат */
  #result { animation: fadeUp 0.3s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .schedule-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 24px;
    border-bottom: none;
  }

  .schedule-date {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .schedule-meta {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .schedule-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .pairs-list {
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }

  .pair-item {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 12px;
    align-items: start;
    transition: background 0.15s;
  }

  .pair-item:last-child { border-bottom: none; }
  .pair-item:hover { background: var(--surface2); }

  .pair-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    padding-top: 2px;
  }

  .pair-subject {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .pair-details {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }

  .pair-tag {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Состояния */
  .state-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
  }

  .state-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  .state-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .state-text { font-size: 14px; color: var(--text-muted); }

  /* Спиннер */
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Пусто */
  .empty-day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    font-size: 15px;
    color: var(--text-muted);
  }

  /* Футер */
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding-top: 40px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  footer a { color: var(--accent); text-decoration: none; }

  /* Список групп */
  .groups-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .group-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    transition: all 0.15s;
  }

  .group-btn:hover { border-color: var(--accent); background: var(--surface2); }
  .group-btn.active {
    border-color: var(--accent);
    background: var(--surface2);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .groups-loading {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 20px;
  }

  @media (max-width: 480px) {
    .corps-grid { grid-template-columns: repeat(2, 1fr); }
    header { padding: 28px 0 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-mark">ВПТ</div>
    <div class="logo-text">
      <h1>Расписание</h1>
      <p>Волжский политехнический техникум</p>
    </div>
  </header>

  <!-- Выбор корпуса -->
  <div class="section">
    <div class="section-label">Корпус</div>
    <div class="corps-grid" id="corps-grid">
      <div class="state-box" style="grid-column:1/-1;padding:20px">
        <div class="spinner"></div>
        <div class="state-text">Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- Группа -->
  <div class="section">
    <div class="section-label">Курс</div>
    <div class="corps-grid" id="course-grid">
      <button class="corp-btn" data-course="1" onclick="selectCourse(1, this)">
        <span class="corp-num">1</span><span>1 курс</span>
      </button>
      <button class="corp-btn" data-course="2" onclick="selectCourse(2, this)">
        <span class="corp-num">2</span><span>2 курс</span>
      </button>
      <button class="corp-btn" data-course="3" onclick="selectCourse(3, this)">
        <span class="corp-num">3</span><span>3 курс</span>
      </button>
      <button class="corp-btn" data-course="4" onclick="selectCourse(4, this)">
        <span class="corp-num">4</span><span>4 курс</span>
      </button>
    </div>
  </div>

  <div class="section" id="groups-section" style="display:none">
    <div class="section-label">Группа</div>
    <div id="groups-list" class="groups-list"></div>
  </div>

  <!-- Режим -->
  <div class="section">
    <div class="section-label">Показать</div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="today">📅 На сегодня</button>
      <button class="mode-tab" data-mode="latest">🆕 Последнее</button>
    </div>
  </div>

  <button class="btn-get" id="btn-get">Получить расписание</button>

  <div id="result"></div>

  <footer>
    <p>Данные берутся напрямую из Google Drive техникума</p>
    <p style="margin-top:6px">
      Бот в Telegram &nbsp;·&nbsp;
      <a href="https://t.me/VPTshedulebot" target="_blank">@VPTshedulebot</a>
    </p>
  </footer>

</div>

<script>
const API = 'https://vpt-schedule-bot-v2-production.up.railway.app';
const CACHE_TTL = 10 * 60 * 1000; // 10 минут

let selectedCorp   = null;
let selectedCourse = null;
let selectedGroup  = null;
let selectedMode   = 'today';

// ── Кэш ───────────────────────────────────────────────────────────────────

function cacheSet(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
  } catch(e) {}
}

function cacheGet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > CACHE_TTL) return null;
    return data;
  } catch(e) { return null; }
}

// ── Загрузка корпусов ──────────────────────────────────────────────────────

async function loadCorps() {
  const cached = cacheGet('corps');
  if (cached) { renderCorps(cached); return; }
  try {
    const res = await fetch(`${API}/corps`);
    const corps = await res.json();
    cacheSet('corps', corps);
    renderCorps(corps);
  } catch(e) {
    document.getElementById('corps-grid').innerHTML =
      '<div class="state-box" style="grid-column:1/-1"><div class="state-text">Ошибка загрузки корпусов</div></div>';
  }
}

function renderCorps(corps) {
  const grid = document.getElementById('corps-grid');
  grid.innerHTML = '';
  corps.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'corp-btn';
    btn.dataset.id = c.id;
    btn.innerHTML = `<span class="corp-num">${c.name.replace(' корпус','')}</span><span>${c.name}</span>`;
    btn.onclick = () => {
      selectedCorp = c.id;
      document.querySelectorAll('#corps-grid .corp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // Сбрасываем выбор курса и группы
      selectedCourse = null;
      selectedGroup  = null;
      document.querySelectorAll('#course-grid .corp-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('groups-section').style.display = 'none';
    };
    grid.appendChild(btn);
  });
}

// ── Выбор курса ───────────────────────────────────────────────────────────

function selectCourse(course, btn) {
  if (!selectedCorp) {
    showToast('Сначала выбери корпус');
    return;
  }
  selectedCourse = course;
  selectedGroup  = null;
  document.querySelectorAll('#course-grid .corp-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadGroups(selectedCorp, course);
}

async function loadGroups(corpId, course) {
  const section = document.getElementById('groups-section');
  const list    = document.getElementById('groups-list');
  section.style.display = 'block';
  list.innerHTML = '<div class="groups-loading">⌛ Загружаю группы...</div>';

  const cacheKey = `groups:${corpId}`;
  let allGroups = cacheGet(cacheKey);

  if (!allGroups) {
    try {
      const res = await fetch(`${API}/groups?corp=${encodeURIComponent(corpId)}`);
      const data = await res.json();
      allGroups = data.groups || [];
      cacheSet(cacheKey, allGroups);
    } catch(e) {
      list.innerHTML = '<div class="groups-loading">Ошибка загрузки групп</div>';
      return;
    }
  }

  // Фильтруем по курсу
  const now = new Date();
  const currentYear = now.getFullYear() % 100;
  const entryYear = now.getMonth() >= 8
    ? currentYear - course + 1
    : currentYear - course;

  const filtered = allGroups.filter(g => {
    const m = g.match(/^\d+-(\d{2})/);
    return m && parseInt(m[1]) === entryYear % 100;
  });

  const groups = filtered.length > 0 ? filtered : allGroups;

  if (groups.length === 0) {
    list.innerHTML = '<div class="groups-loading">Группы не найдены</div>';
    return;
  }

  list.innerHTML = '';
  groups.forEach(g => {
    // Показываем короткое название (до названия специальности)
    const short = g.match(/^([\d\-]+\s+[А-ЯЁA-Z]+[\-\d]+)/);
    const label = short ? short[1].trim() : g.trim();
    const btn = document.createElement('button');
    btn.className = 'group-btn';
    btn.textContent = label;
    btn.title = g;
    btn.onclick = () => {
      selectedGroup = g;
      document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    list.appendChild(btn);
  });
}

// ── Режим ─────────────────────────────────────────────────────────────────

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    selectedMode = tab.dataset.mode;
  };
});

// ── Получить расписание ───────────────────────────────────────────────────

document.getElementById('btn-get').onclick = getSchedule;

async function getSchedule() {
  const btn    = document.getElementById('btn-get');
  const result = document.getElementById('result');

  if (!selectedCorp) {
    showToast('Выбери корпус');
    return;
  }
  if (!selectedGroup) {
    showToast('Выбери группу из списка');
    return;
  }

  const cacheKey = `schedule:${selectedCorp}:${selectedGroup}:${selectedMode}`;
  const cached = cacheGet(cacheKey);
  if (cached) {
    renderSchedule(result, cached);
    result.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Загрузка...';
  showLoading(result);

  try {
    const url = `${API}/schedule?corp=${encodeURIComponent(selectedCorp)}&group=${encodeURIComponent(selectedGroup)}&mode=${selectedMode}`;
    const res = await fetch(url);

    if (res.status === 404) {
      const err = await res.json();
      showError(result, '🔍', 'Не найдено', err.detail || 'Расписание не найдено');
      return;
    }
    if (!res.ok) throw new Error(await res.text());

    const data = await res.json();
    cacheSet(cacheKey, data);
    renderSchedule(result, data);
    result.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(e) {
    showError(result, '⚠️', 'Ошибка', 'Не удалось загрузить расписание. Попробуй ещё раз.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Получить расписание';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      background:#6c63ff;color:#fff;padding:10px 20px;border-radius:20px;
      font-size:14px;z-index:999;opacity:0;transition:opacity 0.2s;
      font-family:'Golos Text',sans-serif;pointer-events:none;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => toast.style.opacity = '0', 2000);
}

// ── Рендер расписания ─────────────────────────────────────────────────────

function renderSchedule(container, data) {
  if (!data.pairs || data.pairs.length === 0) {
    container.innerHTML = '<div class="empty-day">🎉 Занятий нет! Свободный день.</div>';
    return;
  }
  const dateStr = data.date ? `${data.date}${data.day ? ', ' + data.day : ''}` : '';
  const pairsHtml = data.pairs.map(p => `
    <div class="pair-item">
      <div class="pair-num">${p.num}</div>
      <div>
        <div class="pair-subject">${escHtml(p.subject)}</div>
        <div class="pair-details">
          ${p.teacher ? `<span class="pair-tag">👩‍🏫 ${escHtml(p.teacher)}</span>` : ''}
          ${p.room    ? `<span class="pair-tag">🏠 ${escHtml(p.room)}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
  container.innerHTML = `
    <div class="schedule-header">
      <div class="schedule-date">${dateStr || 'Расписание'}</div>
      <div class="schedule-meta">
        <span>👥 ${escHtml(data.group)}</span>
        <span>🏢 ${escHtml(data.corp_name)}</span>
        <span>📚 ${data.pairs.length} ${pluralPairs(data.pairs.length)}</span>
      </div>
    </div>
    <div class="pairs-list">${pairsHtml}</div>
  `;
}

// ── Хелперы ───────────────────────────────────────────────────────────────

function showLoading(container) {
  container.innerHTML = `<div class="state-box"><div class="spinner"></div><div class="state-text">Загружаю расписание...</div></div>`;
}

function showError(container, icon, title, text) {
  container.innerHTML = `<div class="state-box"><div class="state-icon">${icon}</div><div class="state-title">${title}</div><div class="state-text">${text}</div></div>`;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pluralPairs(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'пара';
  if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'пары';
  return 'пар';
}

// ── PWA Service Worker ─────────────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Telegram WebApp ───────────────────────────────────────────────────────

const tg = window.Telegram?.WebApp;

if (tg) {
  // Разворачиваем на весь экран
  tg.expand();
  // Показываем кнопку закрытия
  tg.BackButton.show();
  tg.BackButton.onClick(() => tg.close());
  // Подстраиваем цвета под тему Telegram
  tg.setHeaderColor('#0a0a0f');
  tg.setBackgroundColor('#0a0a0f');
  // Готово
  tg.ready();
}

// ── Старт ─────────────────────────────────────────────────────────────────
loadCorps();
</script>
