<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВПТ — Расписание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --success: #4ade80;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Фоновый узор */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(108,99,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(255,101,132,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* Шапка */
  header {
    padding: 40px 0 32px;
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }

  .logo-mark {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 900;
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(108,99,255,0.3);
  }

  .logo-text h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .logo-text p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Карточки выбора */
  .section-label {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .section { margin-bottom: 28px; }

  /* Сетка корпусов */
  .corps-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .corp-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    font-size: 15px;
    font-weight: 600;
    position: relative;
    overflow: hidden;
  }

  .corp-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .corp-btn span { position: relative; z-index: 1; }

  .corp-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
  .corp-btn.active {
    border-color: var(--accent);
    background: var(--surface2);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(108,99,255,0.2);
  }
  .corp-btn.active::before { opacity: 0.08; }

  .corp-num {
    display: block;
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Поиск группы */
  .search-wrap {
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus { border-color: var(--accent); }

  .search-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Кнопки режима */
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .mode-tab {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    color: var(--text-muted);
    font-family: 'Golos Text', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    text-align: center;
  }

  .mode-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Кнопка получить */
  .btn-get {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    color: #fff;
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 24px rgba(108,99,255,0.3);
    margin-bottom: 28px;
  }

  .btn-get:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(108,99,255,0.4); }
  .btn-get:active { transform: translateY(0); }
  .btn-get:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Результат */
  #result { animation: fadeUp 0.3s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .schedule-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 24px;
    border-bottom: none;
  }

  .schedule-date {
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .schedule-meta {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .schedule-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .pairs-list {
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }

  .pair-item {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 12px;
    align-items: start;
    transition: background 0.15s;
  }

  .pair-item:last-child { border-bottom: none; }
  .pair-item:hover { background: var(--surface2); }

  .pair-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    padding-top: 2px;
  }

  .pair-subject {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .pair-details {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }

  .pair-tag {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Состояния */
  .state-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
  }

  .state-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  .state-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .state-text { font-size: 14px; color: var(--text-muted); }

  /* Спиннер */
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Пусто */
  .empty-day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    font-size: 15px;
    color: var(--text-muted);
  }

  /* Футер */
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding-top: 40px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 480px) {
    .corps-grid { grid-template-columns: repeat(2, 1fr); }
    header { padding: 28px 0 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-mark">ВПТ</div>
    <div class="logo-text">
      <h1>Расписание</h1>
      <p>Волжский политехнический техникум</p>
    </div>
  </header>

  <!-- Выбор корпуса -->
  <div class="section">
    <div class="section-label">Корпус</div>
    <div class="corps-grid" id="corps-grid">
      <div class="state-box" style="grid-column:1/-1;padding:20px">
        <div class="spinner"></div>
        <div class="state-text">Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- Группа -->
  <div class="section">
    <div class="section-label">Группа</div>
    <div class="search-wrap">
      <input
        class="search-input"
        id="group-input"
        type="text"
        placeholder="Например: 2-24 ОРП-1"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >
    </div>
    <div class="search-hint">Введи название точно как в таблице расписания</div>
  </div>

  <!-- Режим -->
  <div class="section">
    <div class="section-label">Показать</div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="today">📅 На сегодня</button>
      <button class="mode-tab" data-mode="latest">🆕 Последнее</button>
    </div>
  </div>

  <button class="btn-get" id="btn-get">Получить расписание</button>

  <div id="result"></div>

  <footer>
    <p>Данные берутся напрямую из Google Drive техникума</p>
    <p style="margin-top:6px">
      Бот в Telegram &nbsp;·&nbsp;
      <a href="https://t.me/VPTshedulebot" target="_blank">@VPTshedulebot</a>
    </p>
  </footer>

</div>

<script>
const API = 'https://vpt-schedule-bot-v2-production.up.railway.app';
let selectedCorp = null;
let selectedMode = 'today';

// ── Загрузка корпусов ──────────────────────────────────────────────────────

async function loadCorps() {
  try {
    const res = await fetch(`${API}/corps`);
    const corps = await res.json();
    const grid = document.getElementById('corps-grid');
    grid.innerHTML = '';
    corps.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'corp-btn';
      btn.dataset.id = c.id;
      btn.innerHTML = `<span class="corp-num">${c.name.replace(' корпус','')}</span><span>${c.name}</span>`;
      btn.onclick = () => selectCorp(c.id, btn);
      grid.appendChild(btn);
    });
  } catch(e) {
    document.getElementById('corps-grid').innerHTML =
      '<div class="state-box" style="grid-column:1/-1"><div class="state-text">Ошибка загрузки корпусов</div></div>';
  }
}

function selectCorp(id, btn) {
  selectedCorp = id;
  document.querySelectorAll('.corp-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Режим ─────────────────────────────────────────────────────────────────

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    selectedMode = tab.dataset.mode;
  };
});

// ── Enter в поле группы ───────────────────────────────────────────────────

document.getElementById('group-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') getSchedule();
});

// ── Получить расписание ───────────────────────────────────────────────────

document.getElementById('btn-get').onclick = getSchedule;

async function getSchedule() {
  const group = document.getElementById('group-input').value.trim();
  const btn   = document.getElementById('btn-get');
  const result = document.getElementById('result');

  if (!selectedCorp) {
    showError(result, '🏢', 'Выбери корпус', 'Нажми на один из корпусов выше');
    return;
  }
  if (!group) {
    showError(result, '👥', 'Введи группу', 'Напиши название группы в поле выше');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Загрузка...';
  showLoading(result);

  try {
    const url = `${API}/schedule?corp=${encodeURIComponent(selectedCorp)}&group=${encodeURIComponent(group)}&mode=${selectedMode}`;
    const res = await fetch(url);

    if (res.status === 404) {
      const err = await res.json();
      if (err.detail.includes('Группа')) {
        showError(result, '🔍', 'Группа не найдена',
          `Группа <b>${group}</b> не найдена в файле расписания.<br>Проверь название — оно должно совпадать с таблицей.`);
      } else {
        showError(result, '📭', 'Нет файлов', 'Файлов расписания не найдено в папке Drive');
      }
      return;
    }

    if (!res.ok) throw new Error(await res.text());

    const data = await res.json();
    renderSchedule(result, data);

  } catch(e) {
    showError(result, '⚠️', 'Ошибка', 'Не удалось загрузить расписание. Попробуй ещё раз.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Получить расписание';
  }
}

// ── Рендер расписания ─────────────────────────────────────────────────────

function renderSchedule(container, data) {
  if (!data.pairs || data.pairs.length === 0) {
    container.innerHTML = `
      <div class="empty-day">
        🎉 Занятий нет! Свободный день.
      </div>`;
    return;
  }

  const dateStr = data.date ? `${data.date}${data.day ? ', ' + data.day : ''}` : '';

  const pairsHtml = data.pairs.map(p => `
    <div class="pair-item">
      <div class="pair-num">${p.num}</div>
      <div>
        <div class="pair-subject">${escHtml(p.subject)}</div>
        <div class="pair-details">
          ${p.teacher ? `<span class="pair-tag">👩‍🏫 ${escHtml(p.teacher)}</span>` : ''}
          ${p.room    ? `<span class="pair-tag">🏠 ${escHtml(p.room)}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="schedule-header">
      <div class="schedule-date">${dateStr || 'Расписание'}</div>
      <div class="schedule-meta">
        <span>👥 ${escHtml(data.group)}</span>
        <span>🏢 ${escHtml(data.corp_name)}</span>
        <span>📚 ${data.pairs.length} ${pluralPairs(data.pairs.length)}</span>
      </div>
    </div>
    <div class="pairs-list">${pairsHtml}</div>
  `;
}

// ── Хелперы ───────────────────────────────────────────────────────────────

function showLoading(container) {
  container.innerHTML = `
    <div class="state-box">
      <div class="spinner"></div>
      <div class="state-text">Загружаю расписание...</div>
    </div>`;
}

function showError(container, icon, title, text) {
  container.innerHTML = `
    <div class="state-box">
      <div class="state-icon">${icon}</div>
      <div class="state-title">${title}</div>
      <div class="state-text">${text}</div>
    </div>`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function pluralPairs(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'пара';
  if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'пары';
  return 'пар';
}

// ── Старт ─────────────────────────────────────────────────────────────────
loadCorps();
</script>
</body>
</html>
